[package]
name = "lowcor"
version = "0.1.0"
description = "LowCor: routine, focus e obiettivi, tutto in locale"
authors = ["XENON1354"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "lowcor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
