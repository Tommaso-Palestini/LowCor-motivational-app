# A ogni push su main: controlli, poi una nuova versione 0.1.<numero della build> su GitHub Releases
# con AppImage e .deb per Linux, installer per Windows e latest.json firmato.
# Le app installate (AppImage su Linux, installer su Windows) la trovano all'avvio e propongono di aggiornarsi.
#
# Segreti del repository richiesti:
#   TAURI_SIGNING_PRIVATE_KEY           contenuto di ~/.tauri/lowcor.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  vuoto se la chiave non ha password
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "tasks/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential file

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  create-release:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - id: release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const version = process.env.VERSION;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              target_commitish: context.sha,
              name: `LowCor ${version}`,
              body: [
                "**Linux:** scarica il file `.AppImage`, rendilo eseguibile (`chmod +x`) e aprilo. Si aggiorna da solo.",
                "Oppure il `.deb` (`sudo apt install ./LowCor_*.deb`), che però non si aggiorna da solo.",
                "",
                "**Windows:** scarica `LowCor_*_x64-setup.exe` e installalo. Il programma non è firmato:",
                "se Windows SmartScreen avvisa, scegli *Ulteriori informazioni → Esegui comunque*.",
                "",
                `Commit: ${context.sha.slice(0, 7)}`,
              ].join("\n"),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: npm ci
      # La versione e gli artefatti per l'aggiornamento si impostano solo qui:
      # in locale le build restano 0.1.0 e non chiedono la chiave di firma.
      - name: Versione e artefatti di aggiornamento
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.env.VERSION;
            // Senza la chiave di firma la versione esce lo stesso, ma senza aggiornamento automatico
            conf.bundle.createUpdaterArtifacts = process.env.HAS_KEY === "true";
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
          '
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ runner.os == 'Linux' && '--bundles appimage,deb' || '--bundles nsis' }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: "true",
            });
